version: "3.9"
services:
  watcher:
    build:
      context: ..
      dockerfile: watcher/Dockerfile
    env_file:
      - .env
    environment:
      FLASK_ENV: production
      ENABLE_SCHEDULER: "false"
      SECRET_KEY: ${SECRET_KEY:-change-me}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-change-me-too}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/app.db}
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      VAULT_ROOT: ${VAULT_ROOT:-/app/vault_data}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@localhost}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ALLOW_BOOTSTRAP_ADMIN: ${ALLOW_BOOTSTRAP_ADMIN:-false}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      NER_SERVICE_URL: ${NER_SERVICE_URL:-http://ner:8000}
      LIBRETRANSLATE_URL: ${LIBRETRANSLATE_URL:-http://libretranslate:4000}
    ports:
      - "5000:5000"
    volumes:
      - watcher-vault:/app/vault_data
      - watcher-db:/app/data
    command: ["gunicorn", "-b", "0.0.0.0:5000", "run:app"]
    restart: unless-stopped
    entrypoint: ["/app/entrypoint.sh"]
    depends_on:
      - ner
      - libretranslate
      - telegram_rss

    deploy:
      resources:
        limits:
          memory: 24G

  watcher-worker:
    build:
      context: ..
      dockerfile: watcher/Dockerfile.worker
    env_file:
      - .env
    environment:
      FLASK_ENV: production
      ENABLE_SCHEDULER: "true"
      SECRET_KEY: ${SECRET_KEY:-change-me}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-change-me-too}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/app.db}
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      VAULT_ROOT: ${VAULT_ROOT:-/app/vault_data}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@localhost}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ALLOW_BOOTSTRAP_ADMIN: ${ALLOW_BOOTSTRAP_ADMIN:-false}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      LIBRETRANSLATE_URL: ${LIBRETRANSLATE_URL:-http://libretranslate:4000}
    volumes:
      - watcher-vault:/app/vault_data
      - watcher-db:/app/data
    command: ["python", "worker.py"]
    restart: unless-stopped
    entrypoint: ["/app/entrypoint.sh"]
    depends_on:
      - libretranslate
      - telegram_rss
    deploy:
      resources:
        limits:
          memory: 12G

  libretranslate:
    image: libretranslate/libretranslate:latest
    environment:
      - LT_UPDATE_MODELS=true
      - LT_LOAD_ONLY=en,fr,ru,fa,ar,es,zh
      - LT_PORT=4000
    ports:
      - "4000:4000"
    restart: unless-stopped
    volumes:
      - libretranslate_api_keys:/app/db
      - libretranslate_models:/home/libretranslate/.local:rw

  ner:
    build:
      context: ../ner_service
      dockerfile: Dockerfile
    environment:
      SERVICE_NAME: ${SERVICE_NAME:-ner-service}
    ports:
      - "8000:8000"
    restart: unless-stopped

  telegram_rss_db:
    image: postgres:16
    command: ["postgres", "-p", "3432"]
    environment:
      POSTGRES_USER: rssuser
      POSTGRES_PASSWORD: rsspass
      POSTGRES_DB: telegram_rss
    volumes:
      - telegram_rss_pgdata:/var/lib/postgresql/data
    ports:
      - "3432:3432"
    restart: unless-stopped

  telegram_rss:
    build:
      context: ../telegram_rss
      dockerfile: Dockerfile
    depends_on:
      - telegram_rss_db
    env_file:
      - ../telegram_rss/.env
    environment:
      DATABASE_URL: postgresql+psycopg://rssuser:rsspass@telegram_rss_db:3432/telegram_rss
      MESS_BOT_API_ID: ${MESS_BOT_API_ID:?Set BOT_API_ID in .env}
      MESS_BOT_API_HASH: ${MESS_BOT_API_HASH:?Set API_HASH in .env}
    volumes:
      - ../telegram_rss/config.yaml:/app/config.yaml:ro
      - ../telegram_rss/sessions:/app/sessions
    ports:
      - "2000:8000"
    restart: unless-stopped

  filebrowser:
      image: filebrowser/filebrowser:latest
      ports:
      - "8081:80"
      volumes:
      - watcher-vault:/srv           # Mounts your existing vault data here
      - ./filebrowser.db:/database.db # Stores users/settings locally
      restart: unless-stopped

volumes:
  watcher-vault:
  watcher-db:
  libretranslate_api_keys:
  libretranslate_models:
  telegram_rss_pgdata:

