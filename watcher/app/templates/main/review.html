{% extends "base.html" %}

{% block content %}
<style>
    /* Tag Cloud Styling */
    .tag-container {
        min-height: 45px;
        border: 1px solid #dee2e6;
        border-radius: 6px;
        padding: 8px;
        background: #fff;
        margin-bottom: 15px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
    }
    .entity-tag {
        font-size: 0.9rem;
        padding: 4px 10px;
        border-radius: 15px;
        display: inline-flex;
        align-items: center;
        user-select: none;
    }
    .entity-tag .remove-btn {
        margin-left: 6px;
        cursor: pointer;
        font-weight: bold;
        opacity: 0.6;
    }
    .entity-tag .remove-btn:hover { opacity: 1; }

    /* Color coding per type */
    .tag-loc { background-color: #e3f2fd; color: #0d47a1; border: 1px solid #90caf9; }
    .tag-org { background-color: #f3e5f5; color: #4a148c; border: 1px solid #ce93d8; }
    .tag-person { background-color: #e8f5e9; color: #1b5e20; border: 1px solid #a5d6a7; }
    .tag-event { background-color: #fff3e0; color: #e65100; border: 1px solid #ffcc80; }
    .tag-tag { background-color: #fff8e1; color: #f57f17; border: 1px solid #ffe082; } /* New Color for Topics */

    /* Custom Context Menu */
    #context-menu {
        display: none;
        position: absolute;
        z-index: 1000;
        background: white;
        border: 1px solid #ccc;
        box-shadow: 2px 2px 10px rgba(0,0,0,0.2);
        border-radius: 4px;
        min-width: 150px;
    }
    #context-menu ul { list-style: none; padding: 0; margin: 0; }
    #context-menu li { padding: 8px 15px; cursor: pointer; border-bottom: 1px solid #eee; font-size: 0.9rem; }
    #context-menu li:hover { background-color: #f8f9fa; }
    #context-menu li:last-child { border-bottom: none; }
</style>

<form action="{{ url_for('main.approve_article', id=article.id) }}" method="post" id="reviewForm">
    
    <div class="row mb-3 align-items-center">
        <div class="col-md-8">
            <small class="text-muted">Reviewing: {{ article.source.name }}</small>
            <input type="text" name="title" class="form-control form-control-lg fw-bold" value="{{ article.title }}">
        </div>
        <div class="col-md-4 text-end">
            <a href="{{ url_for('main.dismiss_article', id=article.id) }}" class="btn btn-outline-danger">Dismiss</a>
            <button type="submit" class="btn btn-success">Publish to Obsidian</button>
        </div>
    </div>

    <div class="row">
        <!-- Metadata Editor (Left Column) -->
        <div class="col-md-4">
            <div class="card mb-3">
                <div class="card-header bg-light">Metadata</div>
                <div class="card-body">
                    
                    <!-- Topic Tags (NEW) -->
                    <label class="form-label fw-bold small text-muted">Topic Tags</label>
                    <div class="input-group mb-2">
                        <input type="text" id="tag-input-box" class="form-control form-control-sm" list="standard-tags-list" placeholder="Add topic...">
                        <button class="btn btn-sm btn-outline-secondary" type="button" onclick="addTagFromInput()">Add</button>
                    </div>
                    <datalist id="standard-tags-list">
                        {% for stag in standard_tags %}
                        <option value="{{ stag.name }}">
                        {% endfor %}
                    </datalist>
                    
                    <div id="container-tags" class="tag-container"></div>
                    <input type="hidden" name="tags" id="input-tags" value="{{ article.tags or '' }}">
                    <hr>

                    <!-- Entities -->
                    <label class="form-label fw-bold small text-muted">Locations</label>
                    <div id="container-locs" class="tag-container"></div>
                    <input type="hidden" name="locs" id="input-locs" value="{{ article.locations or '' }}">

                    <label class="form-label fw-bold small text-muted">Organizations</label>
                    <div id="container-orgs" class="tag-container"></div>
                    <input type="hidden" name="orgs" id="input-orgs" value="{{ article.organizations or '' }}">

                    <label class="form-label fw-bold small text-muted">People</label>
                    <div id="container-people" class="tag-container"></div>
                    <input type="hidden" name="people" id="input-people" value="{{ article.people or '' }}">

                    <label class="form-label fw-bold small text-muted">Events</label>
                    <div id="container-events" class="tag-container"></div>
                    <input type="hidden" name="events" id="input-events" value="{{ article.events or '' }}">

                </div>
            </div>
        </div>

        <!-- Content Editor (Right Column) -->
        <div class="col-md-8">
            <div class="card h-100">
                <div class="card-header">
                    Article Body
                    <small class="float-end text-muted">Markdown Supported</small>
                </div>
                <div class="card-body p-0">
                    <textarea id="article-content" name="content" class="form-control border-0" 
                    style="height: 700px; font-family: monospace; padding: 20px; resize: none;">{{ article.content_edited }}</textarea>
                </div>
            </div>
        </div>
    </div>
</form>

<!-- Context Menu HTML -->
<div id="context-menu">
    <ul>
        <li class="menu-header text-muted small bg-light">Add "<span id="selected-text-preview" class="fw-bold"></span>" as...</li>
        <li onclick="addEntityFromMenu('locs')"><i class="bi bi-geo-alt me-2 text-primary"></i> Location</li>
        <li onclick="addEntityFromMenu('orgs')"><i class="bi bi-building me-2 text-primary"></i> Organization</li>
        <li onclick="addEntityFromMenu('people')"><i class="bi bi-person me-2 text-primary"></i> Person</li>
        <li onclick="addEntityFromMenu('events')"><i class="bi bi-calendar-event me-2 text-primary"></i> Event</li>
    </ul>
</div>

<script>
    // --- 1. State Management ---
    const entityState = {
        locs: new Set(),
        orgs: new Set(),
        people: new Set(),
        events: new Set(),
        tags: new Set() // Added Tags
    };

    let selectionIndices = { start: 0, end: 0 };

    // --- 2. Initialization ---
    document.addEventListener('DOMContentLoaded', () => {
        ['locs', 'orgs', 'people', 'events', 'tags'].forEach(type => {
            const rawVal = document.getElementById(`input-${type}`).value;
            if (rawVal) {
                rawVal.split(',').forEach(item => {
                    if(item.trim()) entityState[type].add(item.trim());
                });
            }
            renderTags(type);
        });
    });

    // --- 3. Rendering Logic ---
    function renderTags(type) {
        const container = document.getElementById(`container-${type}`);
        container.innerHTML = ''; 
        
        entityState[type].forEach(item => {
            const tag = document.createElement('span');
            tag.className = `entity-tag tag-${type.slice(0, -1)}`; 
            tag.innerHTML = `
                ${item} 
                <span class="remove-btn" onclick="removeEntity('${type}', '${item.replace(/'/g, "\\'")}')">&times;</span>
            `;
            container.appendChild(tag);
        });
        document.getElementById(`input-${type}`).value = Array.from(entityState[type]).join(',');
    }

    function removeEntity(type, item) {
        entityState[type].delete(item);
        renderTags(type);
    }

    function addEntity(type, item) {
        if(!item) return;
        let cleanItem = item.trim();
        cleanItem = cleanItem.replace(/^\[\[|\]\]$/g, ''); 
        entityState[type].add(cleanItem);
        renderTags(type);
        return cleanItem;
    }

    // --- 4. Topic Tag Specific Logic ---
    function addTagFromInput() {
        const input = document.getElementById('tag-input-box');
        if(input.value) {
            addEntity('tags', input.value);
            input.value = ''; // Clear input
        }
    }
    
    // Allow 'Enter' key to add tag
    document.getElementById('tag-input-box').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            addTagFromInput();
        }
    });

    // --- 5. Context Menu Logic ---
    const contextMenu = document.getElementById('context-menu');
    const contentArea = document.getElementById('article-content');
    let currentSelection = "";

    contentArea.addEventListener('contextmenu', (e) => {
        const start = contentArea.selectionStart;
        const end = contentArea.selectionEnd;
        const selection = contentArea.value.substring(start, end).trim();
        
        if (selection.length > 0) {
            e.preventDefault();
            currentSelection = selection;
            selectionIndices = { start: start, end: end };
            
            const preview = selection.length > 15 ? selection.substring(0, 15) + '...' : selection;
            document.getElementById('selected-text-preview').innerText = preview;

            contextMenu.style.display = 'block';
            contextMenu.style.left = `${e.pageX}px`;
            contextMenu.style.top = `${e.pageY}px`;
        } else {
            contextMenu.style.display = 'none';
        }
    });

    document.addEventListener('click', (e) => {
        if (contextMenu.style.display === 'block') {
            contextMenu.style.display = 'none';
        }
    });

    function addEntityFromMenu(type) {
        if (currentSelection) {
            const cleanEntity = addEntity(type, currentSelection);
            
            const start = selectionIndices.start;
            const end = selectionIndices.end;
            const originalText = contentArea.value;
            
            let replacement = currentSelection;
            if (!replacement.startsWith('[[') && !replacement.endsWith(']]')) {
                replacement = `[[${cleanEntity}]]`;
            }

            contentArea.value = originalText.substring(0, start) + replacement + originalText.substring(end);

            const container = document.getElementById(`container-${type}`);
            container.style.backgroundColor = "#ffffd6";
            setTimeout(() => container.style.backgroundColor = "#fff", 300);
        }
    }
</script>
{% endblock %}
