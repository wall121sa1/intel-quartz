version: "3.9"
services:
  harvester:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      FUSEKI_ENDPOINT: ${FUSEKI_ENDPOINT:-http://localhost:3030/knowledge-graph/update}
      WATCH_DIR: ${WATCH_DIR:-/data}
      POLL_INTERVAL: ${POLL_INTERVAL:-60}
      BASE_URI: ${BASE_URI:-http://myvault.com/}
    volumes:
      - ./data:/data:ro
    restart: unless-stopped
