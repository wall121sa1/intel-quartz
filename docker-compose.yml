x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ==========================================
  # DATABASES
  # ==========================================

  postgres_watcher:
    build:
      context: .
      dockerfile: services/shared/postgres.Dockerfile
    container_name: quartz-db-watcher
    environment:
      POSTGRES_USER: watcher
      POSTGRES_PASSWORD: ${WATCHER_DB_PASSWORD:-watcherpass}
      POSTGRES_PASSWORD_DEFAULT: watcherpass
      POSTGRES_CREDENTIAL_KEY: POSTGRES_WATCHER_PASSWORD
      CREDENTIALS_FILE: /credentials/credentials.txt
      POSTGRES_DB: watcher
    entrypoint: ["/opt/quartz/postgres-entrypoint.sh"]
    volumes:
      - watcher-db:/var/lib/postgresql/data
      - credentials:/credentials
      # Mount script Read-Only to ensure we use the local one (make sure it has LF endings!)
      - ./services/shared/postgres-entrypoint.sh:/opt/quartz/postgres-entrypoint.sh:ro
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watcher"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres_rss:
    build:
      context: .
      dockerfile: services/shared/postgres.Dockerfile
    container_name: quartz-db-rss
    environment:
      POSTGRES_USER: rssuser
      POSTGRES_PASSWORD: ${RSS_DB_PASSWORD:-rsspass}
      POSTGRES_PASSWORD_DEFAULT: rsspass
      POSTGRES_CREDENTIAL_KEY: POSTGRES_RSS_PASSWORD
      CREDENTIALS_FILE: /credentials/credentials.txt
      POSTGRES_DB: telegram_rss
    entrypoint: ["/opt/quartz/postgres-entrypoint.sh"]
    volumes:
      - rss-db:/var/lib/postgresql/data
      - credentials:/credentials
      - ./services/shared/postgres-entrypoint.sh:/opt/quartz/postgres-entrypoint.sh:ro
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rssuser -d telegram_rss"]
      interval: 10s
      timeout: 5s
      retries: 5

  fuseki:
    build:
      context: .
      dockerfile: services/shared/fuseki.Dockerfile
    container_name: quartz-fuseki
    user: "${FUSEKI_UID:-0}:${FUSEKI_GID:-0}"
    environment:
      - ADMIN_PASSWORD=${FUSEKI_ADMIN_PASSWORD:-changeme}
      - CREDENTIALS_FILE=/credentials/credentials.txt
    volumes:
      - fuseki-data:/fuseki
      - credentials:/credentials
    entrypoint: ["/opt/quartz/fuseki-entrypoint.sh"]
    ports:
      - "3030:3030"
    restart: unless-stopped
    logging: *default-logging

  # ==========================================
  # PYTHON SERVICES
  # ==========================================

  watcher:
    build:
      context: .
      dockerfile: services/watcher/Dockerfile
      target: watcher
    container_name: quartz-watcher
    env_file: .env
    environment:
      DATABASE_URL: ${WATCHER_DB_URL:-postgresql+psycopg2://watcher:watcherpass@postgres_watcher:5432/watcher}
      NER_SERVICE_URL: http://ner:8000
      LIBRETRANSLATE_URL: http://libretranslate:4000
      CREDENTIALS_FILE: /credentials/credentials.txt
      DB_PASSWORD_DEFAULT: watcherpass
    ports:
      - "5000:5000"
    volumes:
      - watcher-vault:/app/vault_data
      - credentials:/credentials
    depends_on:
      postgres_watcher:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  watcher-worker:
    build:
      context: .
      dockerfile: services/watcher/Dockerfile.worker
      target: watcher-worker
    container_name: quartz-watcher-worker
    env_file: .env
    environment:
      DATABASE_URL: ${WATCHER_DB_URL:-postgresql+psycopg2://watcher:watcherpass@postgres_watcher:5432/watcher}
      LIBRETRANSLATE_URL: http://libretranslate:4000
      ENABLE_SCHEDULER: "true"
      CREDENTIALS_FILE: /credentials/credentials.txt
      DB_PASSWORD_DEFAULT: watcherpass
    volumes:
      - watcher-vault:/app/vault_data
      - credentials:/credentials
    depends_on:
      postgres_watcher:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  rss:
    build:
      context: .
      dockerfile: services/rss/Dockerfile
      target: rss
    container_name: quartz-rss
    env_file: .env
    environment:
      DATABASE_URL: ${RSS_DB_URL:-postgresql+psycopg://rssuser:rsspass@postgres_rss:5432/telegram_rss}
      CREDENTIALS_FILE: /credentials/credentials.txt
      DB_PASSWORD_DEFAULT: rsspass
    volumes:
      - rss-sessions:/app/sessions
      - ./services/rss/config.yaml:/app/config.yaml:ro
      - credentials:/credentials
    ports:
      - "2000:8000"
    depends_on:
      postgres_rss:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  harvester:
    build:
      context: .
      dockerfile: services/harvester/Dockerfile
      target: harvester
    container_name: quartz-harvester
    env_file: .env
    environment:
      CREDENTIALS_FILE: /credentials/credentials.txt
    volumes:
      - watcher-vault:/data:ro
      - credentials:/credentials
    depends_on:
      - fuseki
    restart: unless-stopped
    logging: *default-logging

  # ==========================================
  # SUPPORT SERVICES
  # ==========================================

  ner:
    build:
      context: .
      dockerfile: services/ner/Dockerfile
    container_name: quartz-ner
    ports:
      - "8000:8000"
    restart: unless-stopped
    logging: *default-logging

  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: quartz-translate
    environment:
      - LT_UPDATE_MODELS=${LT_UPDATE_MODELS:-true}
      - LT_LOAD_ONLY=${LT_LOAD_ONLY:-en,fr,ru,fa,ar,es,zh}
      - LT_PORT=4000
    volumes:
      - libretranslate-keys:/app/db
      - libretranslate-models:/home/libretranslate/.local:rw
    ports:
      - "4000:4000"
    restart: unless-stopped
    logging: *default-logging

  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: quartz-filebrowser
    ports:
      - "8081:80"
    volumes:
      - watcher-vault:/srv
      - ./data/filebrowser.db:/database.db
    restart: unless-stopped
    logging: *default-logging

  quartz:
    build:
      context: .
      dockerfile: services/quartz/Dockerfile
    container_name: quartz-frontend
    command: ["npx", "quartz", "build", "--serve", "-d", "content", "--port", "8080"]
    ports:
      - "8080:8080"
    volumes:
      - watcher-vault:/usr/src/app/content:ro
    depends_on:
      - watcher
    restart: unless-stopped
    logging: *default-logging

# ==========================================
# VOLUMES
# ==========================================
volumes:
  watcher-vault:
    name: watcher_watcher-vault
  watcher-db:
    name: watcher_watcher-db
  rss-db:
    name: watcher_telegram_rss_pgdata
  rss-sessions:
    name: watcher_telegram_rss_sessions
  fuseki-data:
    name: watcher_fuseki-data
  libretranslate-keys:
    name: watcher_libretranslate_api_keys
  libretranslate-models:
    name: watcher_libretranslate_models
  credentials:
    name: watcher_credentials