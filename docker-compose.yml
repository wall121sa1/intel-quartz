x-logging: &default-logging
  # Reusable logging configuration to prevent log files from growing infinitely.
  # Limits logs to 3 files of 10MB each.
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ==========================================
  # DATABASES
  # ==========================================

  # Primary database for the 'watcher' application logic.
  postgres_watcher:
    build:
      context: .
      dockerfile: services/shared/postgres.Dockerfile
    container_name: quartz-db-watcher
    environment:
      POSTGRES_USER: watcher
      POSTGRES_PASSWORD: ${WATCHER_DB_PASSWORD}
      POSTGRES_DB: watcher
    entrypoint: ["/opt/quartz/postgres-entrypoint.sh"]
    volumes:
      - watcher-db:/var/lib/postgresql/data
      # Mount script Read-Only to ensure we use the local one (make sure it has LF endings!)
      - ./services/shared/postgres-entrypoint.sh:/opt/quartz/postgres-entrypoint.sh:ro
    restart: unless-stopped
    logging: *default-logging
    # Healthcheck ensures the DB is actually ready to accept connections before dependent services start.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watcher"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Dedicated database for the RSS feed service.
  postgres_rss:
    build:
      context: .
      dockerfile: services/shared/postgres.Dockerfile
    container_name: quartz-db-rss
    environment:
      POSTGRES_USER: rssuser
      POSTGRES_PASSWORD: ${RSS_DB_PASSWORD}
      POSTGRES_DB: telegram_rss
    entrypoint: ["/opt/quartz/postgres-entrypoint.sh"]
    volumes:
      - rss-db:/var/lib/postgresql/data
      - ./services/shared/postgres-entrypoint.sh:/opt/quartz/postgres-entrypoint.sh:ro
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rssuser -d telegram_rss"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Apache Jena Fuseki: A SPARQL server used for storing semantic data (Knowledge Graph).
  fuseki:
    build:
      context: .
      dockerfile: services/shared/fuseki.Dockerfile
    container_name: quartz-fuseki
    user: "${FUSEKI_UID:-1000}:${FUSEKI_GID:-1000}"
    environment:
      - ADMIN_PASSWORD=${FUSEKI_ADMIN_PASSWORD}
    volumes:
      - fuseki-data:/fuseki
    entrypoint: ["/opt/quartz/fuseki-entrypoint.sh"]
    ports:
      - "3030:3030"
    restart: unless-stopped
    logging: *default-logging

  # ==========================================
  # PYTHON SERVICES
  # ==========================================

  # The core web application API. Connects to the database, NER, and Translation services.
  watcher:
    build:
      context: .
      dockerfile: services/watcher/Dockerfile
      target: watcher
    container_name: quartz-watcher
    env_file: .env
    environment:
      DATABASE_URL: ${WATCHER_DB_URL}
      NER_SERVICE_URL: http://ner:5454
      LIBRETRANSLATE_URL: http://libretranslate:4000
    ports:
      - "5000:5000"
    volumes:
      - watcher-vault:/app/vault_data
    depends_on:
      postgres_watcher:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  # Background worker for 'watcher'. Handles scheduled tasks (cron jobs) and async processing.
  watcher-worker:
    build:
      context: .
      dockerfile: services/watcher/Dockerfile.worker
      target: watcher-worker
    container_name: quartz-watcher-worker
    env_file: .env
    environment:
      DATABASE_URL: ${WATCHER_DB_URL}
      LIBRETRANSLATE_URL: http://libretranslate:4000
      ENABLE_SCHEDULER: "true"
    volumes:
      - watcher-vault:/app/vault_data
    depends_on:
      postgres_watcher:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  # Service responsible for fetching and managing RSS feeds (e.g., Telegram to RSS).
  rss:
    build:
      context: .
      dockerfile: services/rss/Dockerfile
      target: rss
    container_name: quartz-rss
    env_file: .env
    environment:
      DATABASE_URL: ${RSS_DB_URL}
    volumes:
      - rss-sessions:/app/sessions
      - ./services/rss/config.yaml:/app/config.yaml:ro
    ports:
      - "2000:8000"
    depends_on:
      postgres_rss:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  # Data processing service that likely reads from the vault and updates the Fuseki Knowledge Graph.
  harvester:
    build:
      context: .
      dockerfile: services/harvester/Dockerfile
      target: harvester
    container_name: quartz-harvester
    env_file: .env
    volumes:
      - watcher-vault:/data:ro
    depends_on:
      fuseki:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  # ==========================================
  # SUPPORT SERVICES
  # ==========================================

  # Named Entity Recognition service (likely extracts names, places, orgs from text).
  ner:
    build:
      context: .
      dockerfile: services/ner/Dockerfile
    container_name: quartz-ner
    ports:
      - "5454:8000"
    restart: unless-stopped
    logging: *default-logging

  # Self-hosted offline translation API (alternative to Google Translate).
  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: quartz-translate
    environment:
      - LT_UPDATE_MODELS=${LT_UPDATE_MODELS:-true}
      - LT_LOAD_ONLY=${LT_LOAD_ONLY:-en,fr,ru,fa,ar,es,zh}
      - LT_PORT=4000
    volumes:
      - libretranslate-keys:/app/db
      - libretranslate-models:/home/libretranslate/.local:rw
    ports:
      - "4000:4000"
    restart: unless-stopped
    logging: *default-logging

  # Web-based file manager allowing you to browse/edit files in the 'watcher-vault' volume.
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: quartz-filebrowser
    ports:
      - "8081:80"
    volumes:
      - watcher-vault:/srv
      - ./data/filebrowser.db:/database.db
    restart: unless-stopped
    logging: *default-logging

  # Frontend service (Quartz) that builds and serves a static site based on your markdown content.
  quartz:
    build:
      context: .
      dockerfile: services/quartz/Dockerfile
    container_name: quartz-frontend
    command: ["npx", "quartz", "build", "--serve", "-d", "content", "--port", "8080"]
    ports:
      - "8080:8080"
    volumes:
      - watcher-vault:/usr/src/app/content:ro
    depends_on:
      - watcher
    restart: unless-stopped
    logging: *default-logging

# ==========================================
# VOLUMES
# ==========================================
volumes:
  watcher-vault:
    name: watcher_watcher-vault
  watcher-db:
    name: watcher_watcher-db
  rss-db:
    name: watcher_telegram_rss_pgdata
  rss-sessions:
    name: watcher_telegram_rss_sessions
  fuseki-data:
    name: watcher_fuseki-data
  libretranslate-keys:
    name: watcher_libretranslate_api_keys
  libretranslate-models:
    name: watcher_libretranslate_models
