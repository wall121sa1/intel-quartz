database:
  # This matches the RSS_DB_URL in your example.txt
  url: postgresql+psycopg://rssuser:rsspass@postgres_rss:5432/telegram_rss

polling:
  interval_seconds: 20
  batch_size: 100
  per_channel_delay_seconds: 1

staging:
  release_interval_minutes: 10
  max_items_per_release: 500
  max_items_per_feed: 200
  default_max_items: 200

bots:
  # Renamed to "mess_bot" so it picks up MESS_BOT_API_ID from your .env
  - name: mess_bot
    session_name: mess_bot.session