database:
  url: postgresql+psycopg2://rssuser:rsspass@postgres_rss:5432/telegram_rss

polling:
  interval_seconds: 20
  batch_size: 100
  per_channel_delay_seconds: 1

staging:
  release_interval_minutes: 10
  max_items_per_release: 500
  max_items_per_feed: 200
  default_max_items: 200

bots:
  - name: ru_crime_bot
    theme: crime
    session_name: ru_crime_bot.session
