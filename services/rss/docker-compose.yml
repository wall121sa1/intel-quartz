version: "3.9"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres_rss:
    image: postgres:16
    container_name: quartz-db-rss
    environment:
      POSTGRES_USER: rssuser
      POSTGRES_PASSWORD: rsspass
      POSTGRES_DB: telegram_rss
    volumes:
      - rss-db:/var/lib/postgresql/data
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rssuser -d telegram_rss"]
      interval: 10s
      timeout: 5s
      retries: 5

  rss:
    build:
      context: ../..
      dockerfile: ../../Dockerfile
      target: rss
    container_name: quartz-rss
    depends_on:
      postgres_rss:
        condition: service_healthy
    env_file: ../../.env
    environment:
      DATABASE_URL: ${RSS_DB_URL}
    volumes:
      - rss-sessions:/app/sessions
      - ./config.yaml:/app/config.yaml:ro
    ports:
      - "2000:8000"
    restart: unless-stopped
    logging: *default-logging

volumes:
  rss-db:
    name: watcher_telegram_rss_pgdata
  rss-sessions:
    name: watcher_telegram_rss_sessions
