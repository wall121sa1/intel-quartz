version: "3.9"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres_rss:
    image: postgres:16
    container_name: quartz-db-rss
    environment:
      POSTGRES_USER: rssuser
      POSTGRES_PASSWORD: rsspass
      POSTGRES_PASSWORD_DEFAULT: rsspass
      POSTGRES_CREDENTIAL_KEY: POSTGRES_RSS_PASSWORD
      CREDENTIALS_FILE: /credentials/credentials.txt
      POSTGRES_DB: telegram_rss
    entrypoint: ["/opt/quartz/postgres-entrypoint.sh"]
    volumes:
      - rss-db:/var/lib/postgresql/data
      - credentials:/credentials
      - ../shared/postgres-entrypoint.sh:/opt/quartz/postgres-entrypoint.sh:ro
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rssuser -d telegram_rss"]
      interval: 10s
      timeout: 5s
      retries: 5

  rss:
    build:
      context: ../..
      dockerfile: ../../Dockerfile
      target: rss
    container_name: quartz-rss
    depends_on:
      postgres_rss:
        condition: service_healthy
    env_file: ../../.env
    environment:
      DATABASE_URL: ${RSS_DB_URL:-postgresql+psycopg2://rssuser:rsspass@postgres_rss:5432/telegram_rss}
      CREDENTIALS_FILE: /credentials/credentials.txt
      DB_PASSWORD_DEFAULT: rsspass
    volumes:
      - rss-sessions:/app/sessions
      - ./config.yaml:/app/config.yaml:ro
      - credentials:/credentials
    ports:
      - "2000:8000"
    restart: unless-stopped
    logging: *default-logging

volumes:
  rss-db:
    name: watcher_telegram_rss_pgdata
  rss-sessions:
    name: watcher_telegram_rss_sessions
  credentials:
    name: watcher_credentials
