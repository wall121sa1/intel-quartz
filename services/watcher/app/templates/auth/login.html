{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-body p-5">
                <h2 class="mb-4 text-center">Sign In</h2>
                
                <form method="post" action="{{ url_for('auth.login') }}">
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" placeholder="name@company.com" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Password <small class="text-muted">(Optional for SSO)</small></label>
                        <input type="password" name="password" class="form-control" placeholder="Local admin password">
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100 btn-lg mb-3">Sign In</button>
                </form>

                {% if providers %}
                <div class="text-center mb-3">
                    <span class="text-muted bg-white px-2 position-relative" style="z-index: 1;">OR</span>
                    <hr class="position-relative" style="top: -12px; z-index: 0;">
                </div>

                <div class="d-grid gap-2">
                    {% for p in providers %}
                        <a href="{{ url_for('auth.sso_login', provider=p) }}" class="btn btn-outline-dark text-capitalize">
                            {% if p == 'google' %}
                                <i class="bi bi-google me-2"></i>
                            {% elif p == 'microsoft' %}
                                <i class="bi bi-microsoft me-2"></i>
                            {% elif p == 'cloudflare' %}
                                <i class="bi bi-cloud me-2"></i>
                            {% else %}
                                <i class="bi bi-shield-lock me-2"></i>
                            {% endif %}
                            {{ p }}
                        </a>
                    {% endfor %}
                </div>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
