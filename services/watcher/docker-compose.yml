version: "3.9"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres_watcher:
    build:
      context: ../..
      dockerfile: services/shared/postgres.Dockerfile
    container_name: quartz-db-watcher
    environment:
      POSTGRES_USER: watcher
      POSTGRES_PASSWORD: ${WATCHER_DB_PASSWORD}
      POSTGRES_DB: watcher
    entrypoint: ["/opt/quartz/postgres-entrypoint.sh"]
    volumes:
      - watcher-db:/var/lib/postgresql/data
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watcher"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres_rss:
    build:
      context: ../..
      dockerfile: services/shared/postgres.Dockerfile
    container_name: quartz-db-rss
    environment:
      POSTGRES_USER: rssuser
      POSTGRES_PASSWORD: ${RSS_DB_PASSWORD}
      POSTGRES_DB: telegram_rss
    entrypoint: ["/opt/quartz/postgres-entrypoint.sh"]
    volumes:
      - rss-db:/var/lib/postgresql/data
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rssuser -d telegram_rss"]
      interval: 10s
      timeout: 5s
      retries: 5

  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: quartz-translate
    environment:
      - LT_UPDATE_MODELS=${LT_UPDATE_MODELS:-true}
      - LT_LOAD_ONLY=${LT_LOAD_ONLY:-en,fr,ru,fa,ar,es,zh}
      - LT_PORT=4000
    volumes:
      - libretranslate-keys:/app/db
      - libretranslate-models:/home/libretranslate/.local:rw
    ports:
      - "4000:4000"
    restart: unless-stopped
    logging: *default-logging

  ner:
    build:
      context: ../..
      dockerfile: ../../Dockerfile
      target: ner
    container_name: quartz-ner
    ports:
      - "8000:8000"
    restart: unless-stopped
    logging: *default-logging

  watcher:
    build:
      context: ../..
      dockerfile: ../../Dockerfile
      target: watcher
    container_name: quartz-watcher
    env_file: ../../.env
    environment:
      DATABASE_URL: ${WATCHER_DB_URL}
      NER_SERVICE_URL: http://ner:8000
      LIBRETRANSLATE_URL: http://libretranslate:4000
    ports:
      - "5000:5000"
    volumes:
      - watcher-vault:/app/vault_data
    depends_on:
      postgres_watcher:
        condition: service_healthy
      ner:
        condition: service_started
      libretranslate:
        condition: service_started
    restart: unless-stopped
    logging: *default-logging

  watcher-worker:
    build:
      context: ../..
      dockerfile: ../../Dockerfile
      target: watcher-worker
    container_name: quartz-watcher-worker
    env_file: ../../.env
    environment:
      DATABASE_URL: ${WATCHER_DB_URL}
      LIBRETRANSLATE_URL: http://libretranslate:4000
      ENABLE_SCHEDULER: "true"
    volumes:
      - watcher-vault:/app/vault_data
    depends_on:
      postgres_watcher:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  rss:
    build:
      context: ../..
      dockerfile: ../../Dockerfile
      target: rss
    container_name: quartz-rss
    env_file: ../../.env
    environment:
      DATABASE_URL: ${RSS_DB_URL}
    volumes:
      - rss-sessions:/app/sessions
      - ../rss/config.yaml:/app/config.yaml:ro
    ports:
      - "2000:8000"
    depends_on:
      postgres_rss:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  harvester:
    build:
      context: ../..
      dockerfile: ../../Dockerfile
      target: harvester
    container_name: quartz-harvester
    env_file: ../../.env
    volumes:
      - watcher-vault:/data:ro
    depends_on:
      fuseki:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  fuseki:
    build:
      context: ../..
      dockerfile: services/shared/fuseki.Dockerfile
    container_name: quartz-fuseki
    user: "${FUSEKI_UID:-1000}:${FUSEKI_GID:-1000}"
    environment:
      - ADMIN_PASSWORD=${FUSEKI_ADMIN_PASSWORD}
    volumes:
      - fuseki-data:/fuseki
    entrypoint: ["/opt/quartz/fuseki-entrypoint.sh"]
    ports:
      - "3030:3030"
    restart: unless-stopped
    logging: *default-logging

  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: quartz-filebrowser
    ports:
      - "8081:80"
    volumes:
      - watcher-vault:/srv
      - ../../data/filebrowser.db:/database.db
    restart: unless-stopped
    logging: *default-logging

volumes:
  watcher-vault:
    name: watcher_watcher-vault
  watcher-db:
    name: watcher_watcher-db
  rss-db:
    name: watcher_telegram_rss_pgdata
  rss-sessions:
    name: watcher_telegram_rss_sessions
  fuseki-data:
    name: watcher_fuseki-data
  libretranslate-keys:
    name: watcher_libretranslate_api_keys
  libretranslate-models:
    name: watcher_libretranslate_models
