version: "3.9"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  harvester:
    build:
      context: ../..
      dockerfile: ../../Dockerfile
      target: harvester
    env_file: ../../.env
    environment:
      FUSEKI_ENDPOINT: ${FUSEKI_ENDPOINT:-http://fuseki:3030/knowledge-graph/update}
      FUSEKI_DATASET_NAME: ${FUSEKI_DATASET_NAME:-knowledge-graph}
      FUSEKI_ADMIN_USER: ${FUSEKI_ADMIN_USER:-admin}
      FUSEKI_ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD:-changeme}
      WATCH_DIR: ${WATCH_DIR:-/data}
      POLL_INTERVAL: ${POLL_INTERVAL:-60}
      BASE_URI: ${BASE_URI:-file:///data/}
    volumes:
      - watcher-vault:/data:ro
    restart: unless-stopped
    depends_on:
      - fuseki
    logging: *default-logging

  fuseki:
    image: stain/jena-fuseki:latest
    restart: unless-stopped
    environment:
      - ADMIN_PASSWORD=${FUSEKI_ADMIN_PASSWORD:-changeme}
    volumes:
      - fuseki-data:/fuseki
    ports:
      - "3030:3030"
    logging: *default-logging

volumes:
  watcher-vault:
    name: watcher_watcher-vault
  fuseki-data:
    name: watcher_fuseki-data
