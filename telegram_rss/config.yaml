database:
  # DATABASE_URL env var will override this in Docker
  url: postgresql+psycopg://rssuser:rsspass@postgres:3432/telegram_rss

polling:
  interval_seconds: 20
  batch_size: 100
  per_channel_delay_seconds: 1

staging:
  release_interval_minutes: 10
  max_items_per_release: 500
  max_items_per_feed: 200
  default_max_items: 200

bots:
  # Bot 1
  - name: "MESS_BOT"
    theme: "None"
    session_name: "None"