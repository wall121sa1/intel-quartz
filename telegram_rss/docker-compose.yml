version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rssuser
      POSTGRES_PASSWORD: rsspass
      POSTGRES_DB: telegram_rss
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  telegram_rss:
    build: .
    depends_on:
      - postgres
    environment:
      # DB connection (overrides config.yaml)
      DATABASE_URL: postgresql+psycopg://rssuser:rsspass@postgres:5432/telegram_rss

      # Bot 1 (ru_crime_bot)
      RU_CRIME_BOT_API_ID: "123456"           # <-- replace with your real API ID
      RU_CRIME_BOT_API_HASH: "your_ru_hash"   # <-- replace with your real API hash

      # Bot 2 (fa_markets_bot)
      FA_MARKETS_BOT_API_ID: "654321"         # <-- replace with your real API ID
      FA_MARKETS_BOT_API_HASH: "your_fa_hash" # <-- replace with your real API hash
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      # Persist Telethon session files across restarts
      - ./sessions:/app
    ports:
      # container_port:host_port
      # App listens on 8000 in container, exposed as 2000 on your machine
      - "2000:8000"
    restart: unless-stopped

volumes:
  pgdata:
