version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rssuser
      POSTGRES_PASSWORD: rsspass
      POSTGRES_DB: telegram_rss
      ports: 3432:3432
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Expose database on a non-default host port to avoid local conflicts
      - "3452:5432"
    restart: unless-stopped

  telegram_rss:
    build: .
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      # DB connection (overrides config.yaml)
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://rssuser:rsspass@postgres:3432/telegram_rss}

      # Bot 1 (Mess Bot)
      MESS_BOT_API_ID: ${MESS_BOT_API_ID:?Set BOT_API_ID in .env}
      MESS_BOT_API_HASH: ${MESS_BOT_API_HASH:?Set API_HASH in .env}

      # Bot 2 (fa_markets_bot)
     # FA_MARKETS_BOT_API_ID: ${FA_MARKETS_BOT_API_ID:?Set FA_MARKETS_BOT_API_ID in .env}
     # FA_MARKETS_BOT_API_HASH: ${FA_MARKETS_BOT_API_HASH:?Set FA_MARKETS_BOT_API_HASH in .env}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      # Persist Telethon session files across restarts without shadowing the app code
      - ./sessions:/app/sessions
    ports:
      # host_port:container_port
      # App listens on 8000 in container, exposed as 2000 on your machine
      - "2000:8000"
    restart: unless-stopped

volumes:
  pgdata:
