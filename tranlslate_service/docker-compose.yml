version: "3.9"

services:
  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: libretranslate
    ports:
      - "5000:5000"
    environment:
      # Limit to the languages you care about
      # ar = Arabic, fa = Farsi, ru = Russian, uk = Ukrainian,
      # es = Spanish, fr = French, en = English
      - LT_LOAD_ONLY=ar,fa,ru,uk,es,fr,en
    volumes:
      # Persist downloaded models & cache so they aren't re-downloaded every time
      - libretranslate_data:/home/libretranslate/.local/share
      - libretranslate_cache:/home/libretranslate/.local/cache
    restart: unless-stopped

volumes:
  libretranslate_data:
  libretranslate_cache:
